<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  color-scheme:light;
  --bg:#fbfbf9; --fg:#1a1a18; --muted:#6b6b63; --rule:#e2e0d8;
  --card:#fff; --accent:#b4530a; --accent-soft:#fdf3ea;
  --a:#1f7a4d; --a-bg:#e8f5ee; --b:#8a6d1f; --b-bg:#faf3dd; --unv:#8a3232; --unv-bg:#fbecec;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 var(--serif);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr;gap:40px}
@media(min-width:1000px){.wrap{grid-template-columns:230px minmax(0,1fr)}}
.wrap.no-toc{grid-template-columns:minmax(0,1fr)}.wrap.no-toc nav.toc{display:none}
header.top{border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
header.top .inner{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.kicker{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:8px}
button{font:600 13px/1 var(--sans);padding:9px 14px;border-radius:8px;border:1px solid var(--rule);
  background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{opacity:.88;color:#fff}
nav.toc{display:none;font:14px/1.5 var(--sans);align-self:start;padding-top:36px}
@media(min-width:1000px){nav.toc{display:block;position:sticky;top:70px;max-height:calc(100vh - 100px);overflow:auto}}
nav.toc a{display:block;padding:4px 0 4px 10px;color:var(--muted);text-decoration:none;border-left:2px solid var(--rule)}
nav.toc a:hover{color:var(--fg)}
nav.toc a.h3{padding-left:22px;font-size:13px}
nav.toc a.active{color:var(--accent);border-left-color:var(--accent)}
main{padding:36px 0 96px;min-width:0}
main h1{font:700 clamp(30px,4.5vw,42px)/1.15 var(--sans);letter-spacing:-.02em;margin:0 0 20px}
main h2{font:700 25px/1.25 var(--sans);letter-spacing:-.01em;margin:52px 0 14px;padding-top:16px;border-top:1px solid var(--rule)}
main h3{font:650 19px/1.3 var(--sans);margin:30px 0 8px}
main h4{font:650 15px/1.3 var(--sans);margin:22px 0 6px;color:var(--muted)}
main p,main li{max-width:68ch}
main>p{position:relative}
.copy-p,.del-p{position:absolute;right:-6px;top:2px;font:600 11px/1 var(--sans);padding:4px 7px;opacity:0}
main>p:hover .copy-p,.copy-p:focus,main>p:hover .del-p,.del-p:focus{opacity:.8}
.del-p{right:-52px}
.del-p,.del-sec{color:var(--unv)}
main a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
main a:hover{border-bottom-color:var(--accent)}
main a[href*="#:~:text="]::after{content:"\2197";font-size:.7em;vertical-align:super;opacity:.6;margin-left:1px}
blockquote{margin:20px 0;padding:14px 20px;border-left:3px solid var(--accent);
  background:var(--accent-soft);border-radius:0 8px 8px 0;font-style:italic}
blockquote p{margin:0}
code{font:.87em var(--mono);background:var(--card);border:1px solid var(--rule);padding:1px 5px;border-radius:4px}
pre{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;overflow-x:auto}
pre code{border:0;background:none;padding:0;font-size:13px}
table{border-collapse:collapse;width:100%;font:14px/1.5 var(--sans);margin:18px 0;display:block;overflow-x:auto}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
hr{border:0;border-top:1px solid var(--rule);margin:44px 0}
hr + h2{border-top:0;padding-top:0;margin-top:24px}
main h2 .copy-sec,main h2 .del-sec{font:600 11px/1 var(--sans);padding:5px 9px;margin-left:10px;vertical-align:middle;opacity:.55}
main h2:hover .copy-sec,main h2 .copy-sec:focus,main h2:hover .del-sec,main h2 .del-sec:focus{opacity:1}
sup{font:650 10px/1 var(--sans);background:var(--card);padding:2px 5px;border-radius:4px;vertical-align:super;margin-left:3px}
/* tier badges: [A] [B] [unverified] */
.tier-a{background:var(--a-bg)!important;color:var(--a)}
.tier-b{background:var(--b-bg)!important;color:var(--b)}
.tier-u{background:var(--unv-bg)!important;color:var(--unv)}
.meta{font:14px/1.6 var(--sans);color:var(--muted);margin:0 0 8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--fg);color:var(--bg);font:600 13px var(--sans);padding:10px 18px;border-radius:8px;
  transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
@media print{header.top,nav.toc{display:none}.wrap{display:block}main{padding:0}}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <span class="kicker">Research Report</span>
    <div class="actions">
      <button id="toggle-toc">Hide TOC</button>
      <button id="copy-md">Copy Markdown</button>
      <button id="export-md" class="primary">Export .md</button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="toc" id="toc"></nav>
  <main id="report"><p class="meta">Rendering…</p></main>
</div>

<div class="toast" id="toast"></div>

<!-- The report itself. Single source of truth: edit here, both the page and the export follow. -->
<script id="source-md" type="text/markdown">
{{MARKDOWN}}
</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const FILENAME = "{{FILENAME}}";
const md = document.getElementById('source-md').textContent.replace(/^\n/, '').replace(/\s*$/, '\n');
const main = document.getElementById('report');
const dead = new Set();  // markdown blocks deleted from the page; Copy/Export skip them
const liveMd = () => [...dead].sort((a, b) => b.length - a.length).reduce((m, s) => m.replace(s, ''), md).replace(/\n{3,}/g, '\n\n');
const toc = document.getElementById('toc');
const untoc = el => { const l = [...toc.children].find(l => l.hash === '#' + el.id); if (l) l.remove(); };

const toast = document.getElementById('toast');
const say = m => { toast.textContent = m; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1600); };

if (window.marked) {
  marked.setOptions({ gfm: true, breaks: false });
  main.innerHTML = marked.parse(md);
} else {
  // CDN blocked/offline — raw markdown still beats a blank page.
  main.innerHTML = '<pre></pre>';
  main.firstChild.textContent = md;
}

// Tier markers: <sup>[A]</sup> / <sup>[B]</sup> / <sup>[unverified]</sup>
main.querySelectorAll('sup').forEach(s => {
  const t = s.textContent.trim();
  if (t === '[A]') s.className = 'tier-a';
  else if (t === '[B]') s.className = 'tier-b';
  else if (/unverified/i.test(t)) s.className = 'tier-u';
});

// Per-section copy: raw markdown from this "## " heading up to the next one.
const h2s = [...main.querySelectorAll('h2')];
const secs = md.split(/^(?=## )/m).slice(1);  // [0] is the preamble
h2s.forEach((h, i) => {
  if (!secs[i]) return;
  const b = document.createElement('button');
  b.className = 'copy-sec'; b.textContent = 'Copy section'; b.title = 'Copy this section as markdown (links included)';
  b.onclick = async e => {
    e.preventDefault();
    try { await navigator.clipboard.writeText(secs[i].replace(/\n---\s*$/, '\n')); say('Section copied'); }
    catch { say('Copy blocked — use Copy Markdown'); }
  };
  h.appendChild(b);
  const d = document.createElement('button');
  d.className = 'del-sec'; d.textContent = 'Delete'; d.title = 'Remove this section from the page and the exported markdown';
  d.onclick = () => {
    dead.add(secs[i]);
    for (let n = h; n && (n === h || n.tagName !== 'H2');) { const nx = n.nextElementSibling; untoc(n); n.remove(); n = nx; }
    say('Section deleted — reload to restore');
  };
  h.appendChild(d);
});

// Per-paragraph copy: match each rendered <p> back to its markdown block by leading text.
const blocks = md.split(/\n\s*\n/);
const plain = t => t.replace(/<sup>[\s\S]*?<\/sup>/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
  .replace(/[*_`>]/g,'').replace(/\s+/g,' ').trim().slice(0,40);
let cursor = 0;
main.querySelectorAll(':scope > p').forEach(el => {
  const c = el.cloneNode(true); c.querySelectorAll('sup').forEach(x => x.remove());
  const key = c.textContent.replace(/\s+/g,' ').trim().slice(0,40);
  if (!key) return;
  const i = blocks.findIndex((b, j) => j >= cursor && plain(b) === key);
  if (i < 0) return;
  cursor = i + 1;
  const b = document.createElement('button');
  b.className = 'copy-p'; b.textContent = 'Copy'; b.title = 'Copy this paragraph as markdown';
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(blocks[i].trim() + '\n'); say('Paragraph copied'); }
    catch { say('Copy blocked — use Copy Markdown'); }
  };
  el.appendChild(b);
  const d = document.createElement('button');
  d.className = 'del-p'; d.textContent = 'Del'; d.title = 'Remove this paragraph from the page and the exported markdown';
  d.onclick = () => { dead.add(blocks[i]); el.remove(); say('Paragraph deleted — reload to restore'); };
  el.appendChild(d);
});

// TOC from h2/h3
const heads = [...main.querySelectorAll('h2, h3')];
heads.forEach((h, i) => {
  h.id = h.id || 'sec-' + i;
  const a = document.createElement('a');
  a.href = '#' + h.id;
  a.textContent = h.firstChild.textContent;
  if (h.tagName === 'H3') a.className = 'h3';
  toc.appendChild(a);
});
const links = [...toc.children];
const spy = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(l => l.classList.toggle('active', l.hash === '#' + e.target.id));
}), { rootMargin: '0px 0px -75% 0px' });
heads.forEach(h => spy.observe(h));


document.getElementById('toggle-toc').onclick = e => {
  const off = document.querySelector('.wrap').classList.toggle('no-toc');
  e.target.textContent = off ? 'Show TOC' : 'Hide TOC';
};
document.getElementById('export-md').onclick = () => {
  const url = URL.createObjectURL(new Blob([liveMd()], { type: 'text/markdown' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: FILENAME });
  a.click();
  URL.revokeObjectURL(url);
  say('Exported ' + FILENAME);
};
document.getElementById('copy-md').onclick = async () => {
  try { await navigator.clipboard.writeText(liveMd()); say('Markdown copied'); }
  catch { say('Copy blocked — use Export'); }
};
</script>
</body>
</html>
