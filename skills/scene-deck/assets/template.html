<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECK TITLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== scene-deck engine: theme tokens (swap these to re-skin) ===== */
:root{
  --paper:#fdfdfb; --ink:#1f1f1c; --muted:#8b8b84; --faint:#d9d9d3;
  --accent:#2b8a67; --accent-soft:#e3f3ec; --mark:#b2efd4; --warn:#b0364a;
  --serif:'Lora',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1); --t:.55s;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center}

/* ===== scenes ===== */
.scene{position:absolute;inset:0 0 100px 0;padding:64px 90px;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s}
.scene.active{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
.scene.reset,.scene.reset *{transition:none!important}

/* ===== type ===== */
h1,.title{font:400 38px/1.3 var(--serif);margin-bottom:28px}
.lede{font:400 46px/1.5 var(--serif);max-width:1250px}
.body{font:400 26px/1.55 var(--serif);max-width:1100px}
.small{font:400 20px/1.5 var(--serif);color:var(--muted)}
.label,.kicker{font:400 15px/1.5 var(--mono);color:var(--muted);letter-spacing:.02em}
.kicker{display:block;margin-bottom:10px}
.mono{font-family:var(--mono)}
.accent{color:var(--accent)} .muted{color:var(--muted)} .warn{color:var(--warn)}
.src{position:absolute;left:90px;bottom:14px;font:italic 14px/1.4 var(--serif);color:var(--muted)}
.abs{position:absolute}
.row{display:flex;gap:48px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:18px}
.card{border:1.5px solid var(--ink);padding:22px 26px;background:var(--paper)}
.card.soft{border-color:var(--faint)}
.card.hi{border-color:var(--accent);background:var(--accent-soft)}
svg{overflow:visible}
svg text{font-family:var(--serif)} svg text:not([fill]){fill:var(--ink)}
svg .t-mono{font-family:var(--mono);fill:var(--muted)}
svg .t-it{font-style:italic;fill:var(--muted)}
svg :is(text,tspan).accent{fill:var(--accent)} svg :is(text,tspan).muted{fill:var(--muted)} svg :is(text,tspan).warn{fill:var(--warn)}
.ink{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ink.acc{stroke:var(--accent)} .ink.warn{stroke:var(--warn)} .ink.thin{stroke-width:1} .ink.faint{stroke:var(--faint)}
.fill-acc{fill:var(--accent)} .fill-soft{fill:var(--accent-soft)} .fill-paper{fill:var(--paper)} .fill-ink{fill:var(--ink)}

/* ===== step states =====
   data-step=n  hidden until local step n, then animates in
   data-fx=n    always visible; its effect (mark sweep, strike, .glow) fires at n
   data-dim=n   ghosts to faint at n        data-out=n  disappears at n          */
[data-step]{transition:opacity var(--t) var(--ease),transform var(--t) var(--ease)}
[data-step]:not(.on){opacity:0;transform:translateY(10px)}
svg [data-step]:not(.on){transform:none}
.pop{transform-box:fill-box;transform-origin:center}
.pop[data-step]:not(.on){transform:scale(.6)}
.dimmed{opacity:.18!important}
.gone{opacity:0!important;pointer-events:none}
[data-dim],[data-out]{transition:opacity var(--t) var(--ease),transform var(--t) var(--ease)}

/* draw-on strokes: any shape inside .draw traces itself; fills fade in after */
.draw[data-step]:not(.on){opacity:1;transform:none}
.draw-shape{stroke-dasharray:var(--len);stroke-dashoffset:0;
  transition:stroke-dashoffset .9s var(--ease) min(calc(var(--i,0)*.12s),1.4s),fill-opacity .4s ease min(calc(var(--i,0)*.12s + .5s),1.9s)}
.draw:not(.on) .draw-shape,.draw-shape.draw:not(.on){stroke-dashoffset:var(--len);fill-opacity:0}
.draw text,.draw-fade{transition:opacity .4s ease .45s}
.draw:not(.on) :is(text,.draw-fade){opacity:0}
.draw-fade.draw[data-step]:not(.on){opacity:0}

/* marker highlight + strike sweep in */
mark{color:inherit;background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 0/100% 100%;padding:0 .12em;margin:0 -.04em;transition:background-size .6s var(--ease) .15s}
s{text-decoration:none;position:relative;white-space:nowrap}
s::after{content:'';position:absolute;left:-.05em;right:-.05em;top:56%;height:2px;background:var(--warn);transform-origin:left;transition:transform .5s var(--ease) .1s}
mark[data-fx]:not(.fx-on),[data-step]:not(.on) mark,mark[data-step]:not(.on){background-size:0 100%}
s[data-fx]:not(.fx-on)::after,[data-step]:not(.on) s::after{transform:scaleX(0)}
.glow:not([data-step]):not(.draw-shape){transition:color .4s,stroke .4s,fill .4s,border-color .4s}
[data-step].glow{transition:opacity var(--t) var(--ease),transform var(--t) var(--ease),color .4s,fill .4s,stroke .4s,border-color .4s}
.glow.fx-on{color:var(--accent);border-color:var(--accent)}
svg .glow.fx-on:not(text){stroke:var(--accent)} svg text.glow.fx-on{fill:var(--accent)}

/* ambient motion */
.spin{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-6px)}}
.sketch{filter:url(#sketch)}

/* ===== timeline ===== */
#timeline{position:absolute;left:90px;right:90px;bottom:26px;height:56px;cursor:pointer;touch-action:none}
#timeline .rail,#timeline .fill{position:absolute;left:0;top:40px;height:2px;background:var(--faint)}
#timeline .rail{right:0}
#timeline .fill{background:var(--accent);transition:width var(--t) var(--ease)}
.dot{position:absolute;top:36px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:1.5px solid var(--faint);background:var(--paper);transition:.3s}
.dot.past{background:var(--accent);border-color:var(--accent)}
.dot b{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:400 13px var(--mono);color:var(--muted)}
.dot i{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);white-space:nowrap;font:italic 15px var(--serif);color:var(--ink);background:var(--paper);padding:2px 8px;opacity:0;transition:opacity .2s;pointer-events:none}
.dot:hover i{opacity:1}
#mascot{position:absolute;top:9px;width:32px;margin-left:-16px;color:var(--ink);transition:left var(--t) var(--ease);pointer-events:none}
#mascot svg{display:block;width:32px;height:32px;transform-origin:50% 100%}
#mascot.back svg{transform:scaleX(-1)}
#mascot.walk svg{animation:waddle .2s ease-in-out infinite alternate}
#mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes waddle{from{rotate:-8deg}to{rotate:8deg;translate:0 -1.5px}}
@keyframes blink{0%,95%,100%{scale:1 1}97.5%{scale:1 .1}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sketch"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--ink)" stroke-width="1.2"/></pattern>
</svg>

<div id="stage">
<!-- ===================== SCENES START ===================== -->

<section class="scene" data-chapter="Hello">
  <span class="kicker">scene-deck · template</span>
  <p class="lede">
    <span data-step="1">Replace these scenes</span>
    <span data-step="2">with <mark data-fx="3">your</mark> <s data-fx="4">slides</s> scenes.</span>
  </p>
  <svg class="abs draw sketch" data-step="2" style="left:1150px;top:420px" width="200" height="200" viewBox="0 0 200 200">
    <circle class="ink acc" cx="100" cy="100" r="80"/>
    <text x="100" y="106" text-anchor="middle" class="t-it" font-size="20">step 2</text>
  </svg>
  <p class="src">source · italic citation goes here</p>
</section>

<!-- ===================== SCENES END ======================= -->
  <div id="timeline"><div class="rail"></div><div class="fill"></div>
    <div id="mascot"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12 C7 4.5 25 4.5 25 12 V22 C25 28.5 7 28.5 7 22 Z" style="fill:var(--paper)"/>
      <path d="M8.5 8.5 L7 2.5 L12 6 M23.5 8.5 L25 2.5 L20 6"/>
      <path d="M7 15 C4.5 18 5 23 8.5 25.5 M25 15 C27.5 18 27 23 23.5 25.5"/>
      <circle cx="12" cy="12.5" r="3.7" style="fill:var(--paper)"/><circle cx="20" cy="12.5" r="3.7" style="fill:var(--paper)"/>
      <circle class="eye" cx="12.5" cy="12.8" r="1.6" fill="currentColor" stroke="none"/><circle class="eye" cx="20.5" cy="12.8" r="1.6" fill="currentColor" stroke="none"/>
      <path d="M15 15.6 L16 18.4 L17 15.6 Z" style="fill:var(--accent)" stroke="none"/>
      <path d="M12 21 q1.3 1.3 2.6 0 q1.3 1.3 2.6 0 q1.3 1.3 2.6 0 M13.3 24 q1.3 1.3 2.6 0 q1.3 1.3 2.6 0" stroke-width="1"/>
      <path d="M13 28 v2.5 M19 28 v2.5" style="stroke:var(--accent)"/>
    </svg></div>
  </div>
</div>

<script>
/* ===== scene-deck engine (no edits needed) ===== */
(() => {
  const stage = document.getElementById('stage');
  const scenes = [...document.querySelectorAll('.scene')];
  const SHAPES = 'path,line,polyline,polygon,circle,ellipse,rect';
  const KEYS = ['step', 'fx', 'dim', 'out'];

  // Prep draw-on shapes: measure stroke length, stagger children.
  document.querySelectorAll('.draw').forEach(g => {
    if (!g.hasAttribute('data-step')) g.dataset.step = 0;
    const shapes = g.matches(SHAPES) ? [g] : [...g.querySelectorAll(SHAPES)];
    shapes.forEach((s, i) => {
      if (s.getAttribute('stroke-dasharray')) return s.classList.add('draw-fade'); // keep authored dashes; fade instead
      s.classList.add('draw-shape');
      s.style.setProperty('--len', Math.ceil(s.getTotalLength ? s.getTotalLength() : 2000) + 1);
      if (!s.style.getPropertyValue('--i')) s.style.setProperty('--i', i);
    });
  });

  // Flatten scenes into a global step list; chapters start at scenes with data-chapter.
  const steps = [], chapters = [];
  scenes.forEach((sc, i) => {
    const nums = [...sc.querySelectorAll(KEYS.map(k => `[data-${k}]`).join())]
      .flatMap(e => KEYS.map(k => +e.dataset[k] || 0));
    const n = Math.max(0, ...nums);
    if (sc.dataset.chapter || !chapters.length) chapters.push({ title: sc.dataset.chapter || '', start: steps.length });
    for (let k = 0; k <= n; k++) steps.push([i, k]);
  });
  const last = Math.max(1, steps.length - 1);

  // Timeline dots
  const tl = document.getElementById('timeline'), fill = tl.querySelector('.fill'), mascot = document.getElementById('mascot');
  const dots = chapters.map((c, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.style.left = (c.start / last * 100) + '%';
    d.innerHTML = `<b>${i + 1}</b>` + (c.title ? `<i>${c.title}</i>` : '');
    tl.appendChild(d); return d;
  });

  function apply(sc, k) {
    for (const e of sc.querySelectorAll('[data-step]')) e.classList.toggle('on', k >= +e.dataset.step);
    for (const e of sc.querySelectorAll('[data-fx]')) e.classList.toggle('fx-on', k >= +e.dataset.fx);
    for (const e of sc.querySelectorAll('[data-dim]')) e.classList.toggle('dimmed', k >= +e.dataset.dim);
    for (const e of sc.querySelectorAll('[data-out]')) e.classList.toggle('gone', k >= +e.dataset.out);
  }
  function instant(sc, k) { sc.classList.add('reset'); apply(sc, k); sc.offsetWidth; sc.classList.remove('reset'); }
  scenes.forEach(sc => instant(sc, -1));

  let cur = -1, active = -1;
  const timers = new Map();
  function go(g, animate = true) {
    g = Math.max(0, Math.min(steps.length - 1, g | 0));
    if (g === cur) return;
    const forward = g > cur, [si, k] = steps[g];
    if (si !== active) {
      const old = scenes[active];
      if (old) { old.classList.remove('active'); timers.set(old, setTimeout(() => instant(old, -1), 500)); }
      const sc = scenes[si];
      clearTimeout(timers.get(sc));
      // Entering a scene mid-way (going back / seeking) shows its state at once.
      instant(sc, animate && forward && k === 0 ? -1 : k);
      sc.classList.add('active'); active = si;
    }
    apply(scenes[si], k);
    mascot.classList.toggle('back', !forward && cur !== -1);
    if (cur !== -1) { mascot.classList.add('walk'); clearTimeout(go.w); go.w = setTimeout(() => mascot.classList.remove('walk'), 550); }
    cur = g;
    const pct = cur / last * 100 + '%';
    fill.style.width = pct; mascot.style.left = pct;
    dots.forEach((d, i) => d.classList.toggle('past', chapters[i].start <= cur));
    history.replaceState(null, '', '#' + cur);
  }

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const K = e.key;
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(K)) go(cur + 1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(K)) go(cur - 1);
    else if (K === 'Home') go(0);
    else if (K === 'End') go(steps.length - 1);
    else if (/^[1-9]$/.test(K) && chapters[K - 1]) go(chapters[K - 1].start);
    else if (K === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else return;
    e.preventDefault();
  });

  // Click or drag the timeline to scrub.
  const seek = e => { const r = tl.getBoundingClientRect(); go(Math.round((e.clientX - r.left) / r.width * last)); };
  tl.addEventListener('pointerdown', e => { tl.setPointerCapture(e.pointerId); seek(e); tl.onpointermove = seek; });
  tl.addEventListener('pointerup', () => tl.onpointermove = null);

  const fit = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `translate(-50%,-50%) scale(${s})`; };
  addEventListener('resize', fit); fit();
  const h = +location.hash.slice(1) || 0; go(h, h === 0);
  window.deck = { go, steps, chapters, get cur() { return cur; } };
})();
</script>
</body>
</html>
